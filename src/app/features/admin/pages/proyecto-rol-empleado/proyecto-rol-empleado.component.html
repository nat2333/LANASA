<h2>Roles de empleado en proyectos</h2>

<!-- FORMULARIO -->
<form [formGroup]="form"
      (ngSubmit)="submit()"
      class="card">

  <div class="row">
    <label>Nombre del rol*</label>
    <input
      formControlName="rolEmpleado"
      placeholder="Ej: Jefe de proyecto" />
  </div>

  <div class="row">
    <label>Tarifa por hora*</label>
    <input
      type="number"
      step="0.01"
      formControlName="tarifaHora"
      placeholder="Ej: 150000" />
  </div>

  <div class="row">
    <label>Estado</label>
    <select formControlName="estado">
      <option [ngValue]="true">Activo</option>
      <option [ngValue]="false">Inactivo</option>
    </select>
  </div>

  <div class="actions">
    <button type="submit"
            [disabled]="form.invalid || saving">
      {{ editMode ? 'Actualizar' : 'Crear' }}
    </button>

    <button type="button"
            (click)="cancel()"
            *ngIf="editMode">
      Cancelar
    </button>
  </div>
</form>

<!-- ESTADOS -->
<div *ngIf="loading">Cargando...</div>
<div *ngIf="error" class="error">{{ error }}</div>

<!-- TABLA -->
<table class="tbl" *ngIf="!loading && roles.length">
  <thead>
    <tr>
      <th>ID</th>
      <th>Rol</th>
      <th>Tarifa hora</th>
      <th>Estado</th>
      <th></th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let r of roles">
      <td>{{ r.idRolEmpleado }}</td>
      <td>{{ r.rolEmpleado }}</td>
      <td>{{ r.tarifaHora | number:'1.2-2' }}</td>
      <td>{{ r.estado ? 'Activo' : 'Inactivo' }}</td>
      <td class="right">
        <button type="button" (click)="edit(r)">
          Editar
        </button>
        <button type="button"
                class="danger"
                (click)="toggleEstado(r)"
                [disabled]="deleting">
          {{ r.estado ? 'Activo' : 'Inactivo' }}
        </button>
      </td>
    </tr>
  </tbody>
</table>

<div *ngIf="!loading && !roles.length" class="muted">
  Sin registros.
</div>
